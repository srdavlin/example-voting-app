apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
patchesStrategicMerge:
- deploy.yaml
- service.yaml
namespace: stage
images:
  - name: schoolofdevops/vote:v3
    newTag: v3
replicas:
  - name: vote
    count: 6
commonLables:
  project: example-voting-app
  env: stage
commonAnnotations:
  supported-by: steve@sr-defense.com
configMapGenerator:
  - name: vote
    literals:
      - OPTION_A=DEV
      - OPTION_B=STAGE


